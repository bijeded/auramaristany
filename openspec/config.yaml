schema: spec-driven

# WHAT OPENSPEC INJECTS WHILE PLANNING.
# This file shapes proposals, specs, designs and task lists. It does not govern how code
# gets written — CLAUDE.md does that, and it is the authority for every rule named here.
# Per-artifact rules reach only their artifact; context reaches every artifact plus the
# apply and archive operations.
# Valid artifact ids: proposal · specs · design · tasks. Valid operation ids: apply · archive.

context: |
  Aura Maristany — holistic health coaching for women 40+, sold as recurring monthly
  subscriptions in MXN. Next.js 14 App Router + TypeScript, Supabase (Postgres + RLS +
  Auth + Storage), Stripe, Tailwind + shadcn/ui, Tiptap, Resend, Recharts, dnd-kit, zod,
  Vitest. Deployed on Vercel; DB on Supabase Cloud. main is the live demo Aura sees, so
  no change reaches it except through a branch, a Preview URL, a PR and green CI.

  Sources of truth — read them, don't restate them in artifacts:
    CLAUDE.md          how we work: conventions, the numbered review rules, verification
    openspec/specs/*   what the system does today
    docs/adr/*.md      why the hard decisions went the way they did

  Four domain facts that artifacts get wrong. Deliberately repeated from CLAUDE.md
  review rules 13–17, because a spec is often drafted before that file is consulted and
  each of these is invisible to tsc, lint, the tests and the build. CLAUDE.md carries the
  reasoning and the incident behind each — change them there first, then here.
  - Portal access = active/trialing/past_due via lib/content/subscription-access.ts.
    months_elapsed answers a DIFFERENT question — which content month the client sees —
    and is incremented by invoice.paid, never computed from dates.
  - "Is this subscription ending?" has exactly one derivation: deriveCancellationState.
  - The content grid is 4 weeks x 7 weekdays, addressed by (week_number, day_of_week).
    A date before current_period_start has no cell at all.
  - Money figures exclude subscriptions that won't be charged again; people figures
    include them. Picking the wrong side is invisible to every test, because the
    row-set is identical either way.

  What the demo data cannot do: demo subscriptions carry synthetic Stripe ids
  (sub_seed_*), so no Stripe-touching flow — cancel, reactivate — can be exercised on
  seeded data at all. A smoke step that asks for one is impossible, not merely awkward.

  design-handoff-aura/ is the original prototype and the domain has moved since. Where
  it and the shipped code disagree on LOGIC (Mes·Semana not "Día X de 180"; 4x7 grid not
  6x30; Desempeño with no stat cards; no day-type selector), the shipped code wins and
  openspec/specs/* is the written authority. The prototype wins on look and feel only.

  UI language is neutral Mexican Spanish: 'cliente', never 'clienta'. Applies to every
  user-facing string, email, and error message.

  Tap-target floors are a coding rule, not only a spec rule, so they are here rather
  than under `specs` — context is the only block that also reaches `apply`, where the
  button actually gets written. Buttons >=48px, every tap target >=44px. The single
  documented exception is the kg|lb weight toggle at 32px, decided explicitly because
  it looked too heavy beside the compact "Mi registro" header (portal-exercise-display /
  portal-performance-display). It is scoped to that one control; a new exception needs
  the same explicit reasoning, written down.

rules:
  proposal:
    - State non-goals explicitly. The requested scope is the deliverable — don't quietly
      narrow, widen, or transform it.
    - Name every CLAUDE.md review rule the change touches, by number.
    - Declare whether the change touches a sensitive surface (auth, RLS, service-role,
      webhooks, money, migrations) or has fan-out (cron, email, backfill). That
      declaration sets the review and verification obligations for the whole change.
    - A new KPI or money figure declares which side of the money/people split it is on
      before it is written.

  specs:
    - Every spec file has a real "## Purpose" section. A missing one blocks the
      delta-spec sync that /opsx:archive performs.
    - Requirements state observable behavior, not implementation. One behavior per
      requirement, each with scenarios that test it rather than restate it.
    - Enumerate surfaces by the shape of the content, not by one property spelling or
      one author. "Everywhere authored free text renders" is the real surface list; the
      client writes her own day notes, so "text Aura wrote" excludes them by definition.
    - Derive a status or enum union from lib/supabase/types.ts; never recopy the values.
      A union narrower than the DB CHECK is a defect no test can see.
    - An options list rendered by a component comes entirely from one exported constant.
    - Never assert that two duplicated copies must stay identical — that records a
      defect instead of fixing it. Unify them.
    - Honor the product rules the prototype established, they are requirements and not
      styling - one video per exercise; per-set logging (reps + weight, N rows = N sets);
      never body metrics, though progress photos are fine; exercises in cards.

  design:
    - Write one only when there is a real architectural choice; otherwise say so and
      skip it.
    - A lifecycle state spread across columns gets exactly one derivation, named here,
      with its precedence stated.
    - Name the single source of truth for every enum, status list, or design token the
      change introduces, and where its DB CHECK lives.
    - lib/cron/* are service-role modules driven by a CRON_SECRET route, not by
      requireAdmin(). They take an id and write on its behalf, so no design may reach
      them from a server action or an admin screen — a form-supplied id would become an
      arbitrary write.

  tasks:
    - "New pure logic is test-first: failing test, then code, then refactor. Helpers
      get tests; server-only queries do not."
    - A bug fix starts with a test that fails for the stated reason.
    - Adding a column, function, or CHECK gets an explicit task to apply the migration
      and verify it against the real database before merge (CLAUDE.md review rule 11).
    - A schema change is always the next numbered file in supabase/migrations/. They are
      all applied already, so no task may edit an existing one.
    - Touching the DB, Stripe, email, or the cron gets an explicit runtime-verification
      task — green CI does not cover it (CLAUDE.md -> Verification).
    - Manual smoke steps must be possible with the data that actually exists, and must
      be non-destructive.
    - A change that declared a sensitive surface gets an explicit /security-review task
      before the PR is opened. Never write a /code-review task — that command belongs to
      the maintainer alone and cannot be model-invoked (CLAUDE.md -> Review).
    - "The final task is the PR handoff, and it states whether the diff touched a
      silent-defect surface: enum or status unions, money vs. people aggregation,
      cancellation state, migrations, RLS, anything with a DB CHECK."

operations:
  # Advisory, fetched at execution time. Keep it to what is specific to running a change;
  # CLAUDE.md governs how the code itself gets written.
  apply:
    guidance:
      - Work the task list in order. Don't batch a migration task with the code that
        depends on it.
      - Green tsc, lint, tests and build do not verify anything outside the repo. The
        database, Stripe, Vercel config and real data are all outside that gate — see
        CLAUDE.md -> Verification before calling a DB/Stripe/email/cron task done.
      - Never push to main — branch, Preview URL, PR, green CI. main is the live demo
        Aura sees.
      - "Report honestly: if a task is blocked or a step was skipped, say so instead
        of narrowing the scope silently."
      - Update the change's artifacts when implementation teaches you the plan was
        wrong. Code and spec drifting apart is the failure this workflow exists to
        prevent.
  archive:
    guidance:
      - Say yes to the delta-spec sync. /opsx:archive does not merge the deltas into
        openspec/specs/ on its own, and an unsynced archive leaves the main specs
        describing a system that no longer exists, with no change folder left to notice.
